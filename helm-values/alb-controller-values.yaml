clusterName: devsecops-eks
region: us-east-1
# Set at install time if needed: --set vpcId=vpc-xxxx
vpcId: ""
serviceAccount:
  create: false
  name: aws-load-balancer-controller
replicaCount: 2
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
enableShield: false
enableWaf: false
enableWafv2: true
