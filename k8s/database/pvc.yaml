apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-volume-claim
  namespace: three-tier
spec:
  accessModes:
    - ReadWriteOnce
  # EKS default StorageClass (gp2/gp3 via EBS CSI). Avoid hostPath on multi-node clusters.
  storageClassName: gp2
  resources:
    requests:
      storage: 8Gi
