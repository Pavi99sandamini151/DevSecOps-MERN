# ArgoCD Applications — replace GITLAB_REPO_URL and ensure gitops branch exists (G8)
# All apps: prune=false, selfHeal=true (sec-argocd-prune)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serviceaccounts
  namespace: argocd
spec:
  project: three-tier-app
  source:
    repoURL: https://gitlab.com/YOUR_GITLAB_NAMESPACE/devsecops-mern-eks.git
    targetRevision: gitops
    path: k8s/serviceaccounts
  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
---
