apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-tools
  namespace: argocd
spec:
  description: Cluster-wide tooling (Kyverno, monitoring, ALB controller helpers)
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
