apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: three-tier
  labels:
    role: api
    app: backend
spec:
  type: ClusterIP
  selector:
    role: api
  ports:
    - name: http
      port: 3500
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
